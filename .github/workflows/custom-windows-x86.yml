name: Build cliente personalizado (Windows 32 bits)

# Cliente para Windows 32 bits. O Flutter não gera 32 bits, então usa a interface
# antiga (Sciter), como o job build-for-windows-sciter do flutter-build.yml oficial.
# Mesma personalização do custom-windows.yml (custom/apply_branding.py), só recebe
# acesso, com atualização automática num canal próprio (versao-x86.json).

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome interno (sem espaço: letras, números, - e _)"
        required: true
        default: "SuporteAppelsoft"
      display_name:
        description: "Nome de exibição"
        required: true
        default: "Suporte Appelsoft"
      publicar:
        description: "Publicar na VPS ao terminar (download do painel + atualização automática)"
        type: boolean
        default: true

env:
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  TARGET: i686-pc-windows-msvc
  VCPKG_TRIPLET: x86-windows-static
  CANAL: cliente-x86
  VERSAO_PUB: "1.5.3.${{ github.run_number }}"

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Aplicar personalização (nome, ícone, servidor, chave)
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          CONN_TYPE: incoming
          SKIP_LEGACY_SECURE_TCP: "0"
          AUTO_RECORD_OUTGOING: "0"
          ATUALIZADOR: "1"
          ATUALIZADOR_MODO: schtasks
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          API_SERVER: ${{ secrets.API_SERVER }}
        run: |
          pip3 install pillow
          python3 custom/apply_branding.py

      - name: Install LLVM and Clang
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # no release tag; commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          # Igual ao oficial: Sciter x86 precisa de nightly e toolchain i686 como host.
          rustup toolchain install nightly-2023-10-13-${{ env.TARGET }} \
            --target ${{ env.TARGET }} --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-${{ env.TARGET }} --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-sciter

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet ${{ env.VCPKG_TRIPLET }} --x-install-root="$VCPKG_ROOT/installed"

      - name: Build rustdesk (Sciter x86)
        shell: bash
        run: |
          set -e
          python3 res/inline-sciter.py
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          # O instalador procura "<app_name>.exe" na pasta instalada.
          mv ./target/release/rustdesk.exe "./Release/${{ inputs.app_name }}.exe"
          curl -fLJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          curl -fLJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip -q usbmmidd_v2.zip
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: Incluir o atualizador automático
        shell: bash
        run: |
          set -e
          cp custom/atualizar.ps1 ./Release/atualizar.ps1
          printf '{"versao": "%s", "canal": "%s"}\n' "$VERSAO_PUB" \
            "https://remoto.appelsoft.com.br/download/versao-x86.json" > ./Release/atualizacao.json
          echo "Atualizador incluído: canal $CANAL, versão $VERSAO_PUB"

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Build self-extracted executable
        shell: bash
        run: |
          set -e
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e "../../Release/${{ inputs.app_name }}.exe"
          popd
          mkdir -p ./Output
          SAFE_NAME=$(echo "${{ inputs.app_name }}" | tr ' ' '-' | tr -cd '[:alnum:]-_')
          mv ./target/release/rustdesk-portable-packer.exe "./Output/${SAFE_NAME}-${{ env.VERSION }}-x86.exe"

      - name: Upload executável
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app_name }}-windows-x86
          path: ./Output
          if-no-files-found: error

      - name: Publicar na VPS
        if: ${{ inputs.publicar && inputs.app_name == 'SuporteAppelsoft' }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: bash custom/publicar-vps.sh windows cliente-x86 "$VERSAO_PUB" Output/*.exe
