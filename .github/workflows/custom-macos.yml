name: Build personalizado (macOS, experimental)

# Mesmo branding do Windows (custom/apply_branding.py), só Apple Silicon (M1 ou posterior).
# Sem conta Apple Developer: o app sai só com assinatura ad-hoc (sem notarização),
# então no primeiro uso o macOS pede para liberar em Privacidade e Segurança.

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome interno (sem espaço: letras, números, - e _)"
        required: true
        default: "SuporteAppelsoft-Equipe"
      display_name:
        description: "Nome de exibição"
        required: true
        default: "Suporte Appelsoft Equipe"
      bundle_id:
        description: "Bundle id do app no Mac"
        required: true
        default: "br.com.appelsoft.suporte-equipe"
      conn_type:
        description: "incoming = cliente; outgoing = só conecta; completo = os dois"
        required: true
        type: choice
        default: completo
        options:
          - incoming
          - outgoing
          - completo
      publicar:
        description: "Publicar o DMG na VPS ao terminar (download do painel)"
        type: boolean
        default: true

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos:
    name: ${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-26, extra-build-args: "--screencapturekit", arch: aarch64, nome: arm64 }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Aplicar personalização (nome, ícone, servidor, chave)
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          CONN_TYPE: ${{ inputs.conn_type != 'completo' && inputs.conn_type || '' }}
          SKIP_LEGACY_SECURE_TCP: ${{ inputs.conn_type != 'incoming' && '1' || '0' }}
          AUTO_RECORD_OUTGOING: ${{ inputs.conn_type != 'incoming' && '1' || '0' }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          API_SERVER: ${{ secrets.API_SERVER }}
        run: |
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          python3 custom/apply_branding.py

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if ! command -v pkg-config &>/dev/null; then brew install pkg-config; fi

      - name: Install NASM
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Renomear o app e assinar ad-hoc
        # O código do Mac procura /Applications/<app>.app/Contents/MacOS/<app> e usa o
        # bundle id nas permissões; por isso o pacote, o executável e o Info.plist
        # passam a usar o nome do app.
        shell: bash
        env:
          APP: ${{ inputs.app_name }}
          DISP: ${{ inputs.display_name }}
          BUNDLE: ${{ inputs.bundle_id }}
        run: |
          set -e
          cd flutter/build/macos/Build/Products/Release
          mv RustDesk.app "$APP.app"
          mv "$APP.app/Contents/MacOS/RustDesk" "$APP.app/Contents/MacOS/$APP"
          PL="$APP.app/Contents/Info.plist"
          plutil -replace CFBundleExecutable -string "$APP" "$PL"
          plutil -replace CFBundleName -string "$APP" "$PL"
          plutil -replace CFBundleDisplayName -string "$DISP" "$PL" || plutil -insert CFBundleDisplayName -string "$DISP" "$PL"
          plutil -replace CFBundleIdentifier -string "$BUNDLE" "$PL"
          codesign --force --deep -s - "$APP.app"
          codesign -dv "$APP.app" 2>&1 | head -5
          ls "$APP.app/Contents/MacOS"

      - name: Criar DMG
        shell: bash
        env:
          APP: ${{ inputs.app_name }}
        run: |
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p Output
          create-dmg --volname "$APP" --icon "$APP.app" 200 190 --hide-extension "$APP.app" \
            --window-size 800 400 --app-drop-link 600 185 \
            "Output/$APP-mac-${{ matrix.job.nome }}.dmg" "./flutter/build/macos/Build/Products/Release/$APP.app"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app_name }}-mac-${{ matrix.job.nome }}
          path: ./Output
          if-no-files-found: error

      - name: Publicar na VPS
        if: ${{ inputs.publicar && inputs.app_name == 'SuporteAppelsoft-Equipe' }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: bash custom/publicar-vps.sh mac equipe "1.5.3.${{ github.run_number }}" "Output/${{ inputs.app_name }}-mac-${{ matrix.job.nome }}.dmg"
